# Agent-SkillOpt 的 SearchQA 起始配置。
# 复制到项目根目录后，再按本地 SkillOpt 与数据目录调整路径。
version: 1

skillopt:
  root: ../SkillOpt
  entry_script: scripts/train.py
  required_ref: 9c776fcb51ae681c046d6f619b55e5f337d4f900
  upstream_config: configs/searchqa/default.yaml

provider:
  # 这里只保存环境变量名，绝不保存其值。
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash

data:
  task: searchqa
  path: data/searchqa_split

run:
  output_root: runs
  seed: 42
  upstream_args: []

safety:
  require_allow_network: true
  allow_insecure_localhost: false
